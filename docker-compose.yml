# Local infrastructure for development — only needed on machines WITHOUT a locally
# installed RabbitMQ (both use ports 5672/15672 and will conflict).
#   docker compose up -d
# RabbitMQ management UI: http://localhost:15672  (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ridefast-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq-data:
